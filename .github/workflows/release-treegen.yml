name: Release LeafTreeGen to GitHub Releases

# Multi-product monorepo release pipeline for LeafTreeGen (ADR-126):
#   - Publishes distinct LeafTreeGen releases from the DailyStruggle/RTP
#     ("Real-Time Process / Program for Minecraft") monorepo using component-prefixed
#     tags (`leaftreegen-v<semver>`).
#   - Explicitly sets `make_latest: false` so `/releases/latest` on DailyStruggle/RTP
#     remains pinned to the flagship LeafRTP release (ADR-126 Decision 3).
#   - Reads version from `resource/LeafTreeGen/treegen-plugin/build.gradle` and
#     release notes from `resource/LeafTreeGen/CHANGELOG.md`.
#   - Signs deliverables with the repository PGP key (`SIGNING_KEY`), attaches
#     `.sha256` and `.sha512` checksums, and generates GitHub SLSA build provenance.

on:
  push:
    tags:
      - 'leaftreegen-v*.*.*'
      - 'treegen-v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'LeafTreeGen version string to release (e.g. 0.2.0). If omitted, read from resource/LeafTreeGen/treegen-plugin/build.gradle.'
        required: false
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Determine release version and tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
            TAG="leaftreegen-v${VERSION}"
          elif [ "$REF_TYPE" = "tag" ] && [[ "$REF_NAME" =~ ^(leaftreegen|treegen)-[vV]([0-9]+\.[0-9]+.*)$ ]]; then
            VERSION="${BASH_REMATCH[2]}"
            TAG="$REF_NAME"
          else
            VERSION=$(grep -E "^version\s*=\s*['\"]" resource/LeafTreeGen/treegen-plugin/build.gradle | head -n 1 | sed -E "s/.*['\"]([^'\"]+)['\"].*/\1/" | tr -d '[:space:]')
            TAG="leaftreegen-v${VERSION}"
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine LeafTreeGen release version."
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9]+)*$ ]]; then
            echo "::error::Invalid LeafTreeGen release version format: ${VERSION}"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing LeafTreeGen version: ${VERSION} (tag ${TAG})"

      - name: Set up JDK 21 and 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: |
            21
            25
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and validate LeafTreeGen storefront pages (ADR-130)
        run: python3 scripts/release/build_front_pages.py --product leaftreegen

      - name: Build LeafTreeGen jar + checksums + signing
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew :resource:LeafTreeGen:check :resource:LeafTreeGen:treegen-plugin:build :resource:LeafTreeGen:treegen-plugin:generateChecksums :resource:LeafTreeGen:treegen-plugin:signDeliverables

      - name: Locate LeafTreeGen jar and release deliverables
        id: artifact
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          TREEGEN_JAR=$(find resource/LeafTreeGen/treegen-plugin/build/libs -maxdepth 1 -type f -name 'LeafTreeGen-*.jar' \
            ! -name '*-dev.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)
          if [ -z "$TREEGEN_JAR" ] || [ ! -f "$TREEGEN_JAR" ]; then
            echo "::error::Could not locate LeafTreeGen jar under resource/LeafTreeGen/treegen-plugin/build/libs/"
            ls -la resource/LeafTreeGen/treegen-plugin/build/libs/ || true
            exit 1
          fi
          echo "jar=${TREEGEN_JAR}" >> "$GITHUB_OUTPUT"
          echo "Found LeafTreeGen jar: ${TREEGEN_JAR}"

          if [ -f "${TREEGEN_JAR}.asc" ]; then
            echo "asc=${TREEGEN_JAR}.asc" >> "$GITHUB_OUTPUT"
            echo "Found PGP signature: ${TREEGEN_JAR}.asc"
          elif [ -n "$SIGNING_KEY" ]; then
            echo "::error::Missing PGP signature ${TREEGEN_JAR}.asc despite SIGNING_KEY being configured."
            exit 1
          fi

      - name: Extract release notes from resource/LeafTreeGen/CHANGELOG.md
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          CHANGELOG_FILE="resource/LeafTreeGen/CHANGELOG.md"
          if [ ! -f "$CHANGELOG_FILE" ]; then
            echo "::warning::${CHANGELOG_FILE} not found; falling back to generic release notes."
            echo "LeafTreeGen ${VERSION}" > release-notes-treegen.md
          else
            awk -v ver="$VERSION" '
              BEGIN { capture = 0 }
              /^## \[/ {
                if (capture) { exit }
                if (index($0, "[" ver "]") > 0) { capture = 1; next }
              }
              /^\[[0-9]+\.[0-9]+/ {
                if (capture) { exit }
              }
              capture == 1 { print }
            ' "$CHANGELOG_FILE" > release-notes-treegen.md

            if [ ! -s release-notes-treegen.md ]; then
              awk '
                BEGIN { capture = 0 }
                /^## \[Unreleased\]/ { capture = 1; next }
                /^## \[/ { if (capture) { exit } }
                capture == 1 { print }
              ' "$CHANGELOG_FILE" > release-notes-treegen.md
            fi

            if [ ! -s release-notes-treegen.md ]; then
              echo "::warning::No matching section in ${CHANGELOG_FILE} for [${VERSION}]; using placeholder."
              echo "LeafTreeGen ${VERSION}" > release-notes-treegen.md
            fi
          fi
          echo "--- release-notes-treegen.md ---"
          cat release-notes-treegen.md
          echo "--- end ---"

      - name: Generate SLSA Build Provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: ${{ steps.artifact.outputs.jar }}

      - name: Create and push Git tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null \
            || [ -n "$(git ls-remote --tags origin "refs/tags/${TAG}")" ]; then
            echo "Tag ${TAG} already exists locally or remotely. Skipping tag creation."
          else
            echo "Creating and pushing tag ${TAG}..."
            git tag -a "$TAG" -m "Release ${TAG}"
            git push origin "$TAG"
          fi

      - name: Publish GitHub Release (ADR-126)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: LeafTreeGen ${{ steps.version.outputs.version }}
          body_path: release-notes-treegen.md
          prerelease: ${{ contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'alpha') }}
          # ADR-126: Nested plugin releases must never hijack the repository-wide
          # /releases/latest pointer owned by LeafRTP.
          make_latest: false
          files: |
            ${{ steps.artifact.outputs.jar }}
            ${{ steps.artifact.outputs.jar }}.sha256
            ${{ steps.artifact.outputs.jar }}.sha512
            ${{ steps.artifact.outputs.asc }}

      - name: Publish release jar and status update to Discord (#releases)
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          VERSION: ${{ steps.version.outputs.version }}
          JAR_FILE: ${{ steps.artifact.outputs.jar }}
        run: |
          if [ -z "$DISCORD_BOT_TOKEN" ] || [ -z "$DISCORD_GUILD_ID" ]; then
            echo "DISCORD_BOT_TOKEN / DISCORD_GUILD_ID not set; deferring #releases post to discord_support_bot.py Option B poller."
            exit 0
          fi
          python3 discord-support-bot/discord_support_bot.py \
            --publish-release \
            --project treegen \
            --release-version "$VERSION" \
            --release-jar "$JAR_FILE" \
            --release-notes-file release-notes-treegen.md
