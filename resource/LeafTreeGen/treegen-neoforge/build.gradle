plugins {
    // ModDevGradle, version pinned centrally in settings.gradle pluginManagement.
    id 'net.neoforged.moddev'
}

version = '1.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

neoForge {
    version = '26.1.2.71'

    mods {
        leaf_treegen {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation project(':resource:LeafTreeGen:treegen-common')
    implementation(project(':neoforge:neoforge-v26_1_R1')) { transitive = false }
    compileOnly 'com.mojang:brigadier:1.3.10'
}
