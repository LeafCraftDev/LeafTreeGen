plugins {
    id 'java-library'
}

version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    compileOnly 'com.google.code.gson:gson:2.11.0'
    api "io.github.dailystruggle:server-api:${rootProject.version}"
    api "io.github.dailystruggle:yaml-api:${rootProject.version}"
    api "io.github.dailystruggle:commands-api:${rootProject.version}"
    api "io.github.dailystruggle:predict-api:${rootProject.version}"
    api "io.github.dailystruggle:anvil-api:${rootProject.version}"

    testImplementation 'com.google.code.gson:gson:2.11.0'
}

test {
    useJUnitPlatform()
}
